<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punch Book - Punch In/Out</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3B82F6; --primary-dark: #2563EB; --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB;
      --gray-500: #6B7280; --gray-700: #374151; --gray-900: #111827;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3B82F6 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .punch-container {
      background: white; border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      width: 100%; max-width: 500px; position: relative; margin-top: 60px; overflow: visible;
    }
    .logo-container { position: absolute; top: -80px; left: 50%; transform: translateX(-50%); z-index: 10; }
    .logo {
      width: 240px; height: auto; display: block;
      transform: perspective(900px) rotateX(12deg) rotateY(-10deg) scale(1.05);
      image-rendering: -webkit-optimize-contrast;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.35)); transition: all 0.4s ease;
    }
    .logo:hover { transform: perspective(900px) rotateX(0deg) rotateY(0deg) scale(1.1); }
    .punch-header {
      background: linear-gradient(135deg, #1e40af 0%, #3B82F6 100%);
      padding: 80px 30px 30px; text-align: center; color: white; border-radius: 24px 24px 0 0;
    }
    .punch-header h1 { font-size: 28px; margin-bottom: 8px; }
    .punch-header p { opacity: 0.9; font-size: 14px; }
    .datetime-display { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-top: 20px; }
    .datetime-display .date { font-size: 14px; opacity: 0.9; }
    .datetime-display .time { font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .punch-body { padding: 30px; }
    .camera-section { text-align: center; }
    .video-wrapper {
      position: relative; width: 100%; max-width: 350px; margin: 0 auto;
      border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 4/3;
    }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
    .video-wrapper canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .face-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 200px; height: 250px; border: 3px dashed rgba(255,255,255,0.5);
      border-radius: 50%; pointer-events: none;
    }
    .status-message { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 14px; text-align: center; }
    .status-message.loading { background: #FEF3C7; color: #D97706; }
    .status-message.success { background: #D1FAE5; color: #059669; }
    .status-message.error { background: #FEE2E2; color: #DC2626; }
    .status-message.info { background: #DBEAFE; color: #2563EB; }
    .status-message i { margin-right: 8px; }
    .employee-card { display: none; background: var(--gray-50); border-radius: 16px; padding: 24px; margin-top: 24px; text-align: center; }
    .employee-card.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .employee-avatar {
      width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--primary); margin-bottom: 16px;
    }
    .employee-name { font-size: 22px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
    .employee-id { color: var(--gray-500); font-size: 14px; margin-bottom: 8px; }
    .employee-dept { display: inline-block; background: #DBEAFE; color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .punch-status { margin-top: 20px; padding: 16px; background: white; border-radius: 12px; border: 1px solid var(--gray-200); }
    .punch-status-row { display: flex; justify-content: space-between; padding: 8px 0; }
    .punch-status-row:not(:last-child) { border-bottom: 1px solid var(--gray-100); }
    .punch-status-label { color: var(--gray-500); font-size: 14px; }
    .punch-status-value { font-weight: 600; color: var(--gray-900); }
    .punch-status-value.success { color: var(--success); }
    .punch-status-value.warning { color: var(--warning); }
    .btn {
      padding: 16px 32px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center;
      justify-content: center; gap: 10px; width: 100%; margin-top: 20px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-punch-in { background: linear-gradient(135deg, #059669 0%, #10B981 100%); color: white; }
    .btn-punch-in:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }
    .btn-punch-out { background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%); color: white; }
    .btn-punch-out:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3); }
    .btn-secondary { background: var(--gray-200); color: var(--gray-700); }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    .btn-group .btn { margin-top: 0; }
    .scanning { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, #10B981, transparent); animation: scan 2s linear infinite; }
    @keyframes scan { 0% { top: 0; } 50% { top: calc(100% - 4px); } 100% { top: 0; } }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-animation { display: none; text-align: center; padding: 40px; }
    .success-animation.show { display: block; }
    .success-icon { width: 100px; height: 100px; background: #D1FAE5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; animation: popIn 0.5s ease; }
    .success-icon i { font-size: 48px; color: var(--success); }
    @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .success-text { font-size: 24px; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .success-time { font-size: 36px; font-weight: 700; color: var(--success); margin-bottom: 16px; }
    .success-details { color: var(--gray-500); font-size: 14px; }
    @media (max-width: 480px) { .punch-header { padding: 80px 16px 24px; } .punch-body { padding: 20px 16px; } .datetime-display .time { font-size: 28px; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="punch-container">
    <div class="logo-container">
      <img src="punchbook_logo.png" alt="Punch Book" class="logo">
    </div>
    <div class="punch-header">
      <h1>Punch Book</h1>
      <p>Face Recognition Attendance System</p>
      <div class="datetime-display">
        <div class="date" id="currentDate">Loading...</div>
        <div class="time" id="currentTime">--:--:--</div>
      </div>
    </div>
    <div class="punch-body">
      <div class="camera-section" id="cameraSection">
        <div class="video-wrapper">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="canvas"></canvas>
          <div class="face-overlay"></div>
          <div class="scanning" id="scanningLine" style="display: none;"></div>
        </div>
        <div class="status-message loading" id="statusMessage">
          <i class="fas fa-spinner fa-spin"></i>
          <span>Loading face recognition model...</span>
        </div>
      </div>
      <div class="employee-card" id="employeeCard">
        <img class="employee-avatar" id="employeeAvatar" src="" alt="Employee">
        <div class="employee-name" id="employeeName">-</div>
        <div class="employee-id" id="employeeIdDisplay">-</div>
        <div class="employee-dept" id="employeeDept">-</div>
        <div class="punch-status" id="punchStatus">
          <div class="punch-status-row">
            <span class="punch-status-label">Today's Status</span>
            <span class="punch-status-value" id="todayStatus">-</span>
          </div>
          <div class="punch-status-row">
            <span class="punch-status-label">Punch In</span>
            <span class="punch-status-value" id="punchInTime">-</span>
          </div>
          <div class="punch-status-row">
            <span class="punch-status-label">Punch Out</span>
            <span class="punch-status-value" id="punchOutTime">-</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-punch-in" id="btnPunchIn" onclick="doPunchIn()">
            <i class="fas fa-sign-in-alt"></i> Punch In
          </button>
          <button class="btn btn-punch-out" id="btnPunchOut" onclick="doPunchOut()">
            <i class="fas fa-sign-out-alt"></i> Punch Out
          </button>
        </div>
        <button class="btn btn-secondary" onclick="resetAndScan()" style="margin-top:12px;">
          <i class="fas fa-redo"></i> Scan Another
        </button>
      </div>
      <div class="success-animation" id="successAnimation">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <div class="success-text" id="successText">Punch In Successful!</div>
        <div class="success-time" id="successTime">00:00:00</div>
        <div class="success-details" id="successDetails">Have a great day!</div>
        <button class="btn btn-secondary" onclick="resetAndScan()">
          <i class="fas fa-redo"></i> Done
        </button>
      </div>
    </div>
  </div>

  <script>
    // ================== CONFIGURATION (NEW URL) ==================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPxRUqdubBd2xkGH1vSMq7tDzN1Zg_ABdY88etLy0f1KMKwCmas7to_XbI7WrpwHsk/exec';
    // ===========================================================

    let videoStream = null;
    let faceDataList = [];
    let recognizedEmployee = null;
    let currentPunchStatus = null;
    let isProcessing = false;
    let detectionInterval = null;

    // Improved API helper with error logging
    async function callAppsScript(actionData) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          cache: 'no-cache',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(actionData)
        });

        console.log('Response status:', response.status);
        console.log('Content-Type:', response.headers.get('Content-Type'));

        const contentType = response.headers.get('Content-Type') || '';
        if (!contentType.includes('application/json')) {
          const text = await response.text();
          console.error('Non-JSON response (first 200 chars):', text.substring(0, 200));
          return { success: false, message: 'Server returned unexpected response. Check console.' };
        }

        const data = await response.json();
        return data;

      } catch (error) {
        console.error('API call failed:', error);
        return { success: false, message: 'Network error or server unreachable.' };
      }
    }

    async function fetchAllFaceData() {
      const result = await callAppsScript({ action: 'getAllFaceData' });
      if (result.success) {
        faceDataList = result.faceData.map(emp => ({
          ...emp,
          faceDescriptor: Array.isArray(emp.faceDescriptor) ? new Float32Array(emp.faceDescriptor) : emp.faceDescriptor
        }));
      }
      return result;
    }

    async function fetchEmployeeById(empId) {
      return await callAppsScript({ action: 'getEmployeeById', empId: empId });
    }

    async function fetchTodayPunchStatus(empId) {
      return await callAppsScript({ action: 'getTodayPunchStatus', empId: empId });
    }

    async function requestPunchIn(empId, empName, capturedPhoto) {
      return await callAppsScript({ action: 'punchIn', empId, empName, capturedPhoto });
    }

    async function requestPunchOut(empId, capturedPhoto) {
      return await callAppsScript({ action: 'punchOut', empId, capturedPhoto });
    }

    document.addEventListener('DOMContentLoaded', async function() {
      startClock();
      await initializeFaceRecognition();
    });

    function startClock() {
      updateClock();
      setInterval(updateClock, 1000);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('en-IN', {
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
      });
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-IN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }

    async function initializeFaceRecognition() {
      try {
        updateStatus('loading', '<i class="fas fa-spinner fa-spin"></i> Loading face recognition model...');
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        updateStatus('loading', '<i class="fas fa-spinner fa-spin"></i> Loading employee data from server...');
        const result = await fetchAllFaceData();
        if (result.success) {
          startCamera();
        } else {
          updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> ' + result.message);
        }
      } catch (error) {
        updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> Failed to load: ' + error.message);
      }
    }

    async function startCamera() {
      try {
        updateStatus('loading', '<i class="fas fa-video"></i> Starting camera...');
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'user' }
        });
        const video = document.getElementById('video');
        video.srcObject = videoStream;
        video.onloadedmetadata = () => {
          const canvas = document.getElementById('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          updateStatus('info', '<i class="fas fa-search"></i> Position your face in the frame');
          document.getElementById('scanningLine').style.display = 'block';
          startFaceDetection();
        };
      } catch (error) {
        updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> Camera access denied.');
      }
    }

    function startFaceDetection() {
      if (faceDataList.length === 0) {
        updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> No registered employees found.');
        return;
      }
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      detectionInterval = setInterval(async () => {
        if (isProcessing) return;
        try {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks().withFaceDescriptor();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (detection) {
            const box = detection.detection.box;
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 3;
            ctx.strokeRect(box.x, box.y, box.width, box.height);

            const matchedEmployee = findMatchingEmployee(detection.descriptor);
            if (matchedEmployee) {
              isProcessing = true;
              clearInterval(detectionInterval);
              recognizedEmployee = { ...matchedEmployee };
              updateStatus('success', '<i class="fas fa-check-circle"></i> Recognized: ' + matchedEmployee.empName);
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = video.videoWidth;
              tempCanvas.height = video.videoHeight;
              tempCanvas.getContext('2d').drawImage(video, 0, 0);
              recognizedEmployee.capturedPhoto = tempCanvas.toDataURL('image/jpeg', 0.7);
              setTimeout(() => { showEmployeeCard(matchedEmployee); }, 1000);
            }
          }
        } catch (e) {
          console.error('Detection error:', e);
        }
      }, 300);
    }

    function findMatchingEmployee(detectedDescriptor) {
      let bestMatch = null;
      let bestDistance = 0.6;
      for (const faceData of faceDataList) {
        const distance = faceapi.euclideanDistance(detectedDescriptor, faceData.faceDescriptor);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestMatch = faceData;
        }
      }
      return bestMatch;
    }

    async function showEmployeeCard(employee) {
      document.getElementById('cameraSection').classList.add('hidden');
      document.getElementById('employeeAvatar').src = employee.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(employee.empName);
      document.getElementById('employeeName').textContent = employee.empName;
      document.getElementById('employeeIdDisplay').textContent = employee.empId;

      const empResult = await fetchEmployeeById(employee.empId);
      if (empResult.success && empResult.employee) {
        document.getElementById('employeeDept').textContent = empResult.employee.department + ' - ' + empResult.employee.designation;
      } else {
        document.getElementById('employeeDept').textContent = 'Unknown';
      }

      const status = await fetchTodayPunchStatus(employee.empId);
      currentPunchStatus = status;
      if (status.success) {
        if (status.hasPunchedIn) {
          document.getElementById('todayStatus').textContent = 'Punched In';
          document.getElementById('todayStatus').className = 'punch-status-value success';
          document.getElementById('punchInTime').textContent = status.punchIn;
          document.getElementById('btnPunchIn').disabled = true;
          if (status.hasPunchedOut) {
            document.getElementById('todayStatus').textContent = 'Completed';
            document.getElementById('punchOutTime').textContent = status.punchOut;
            document.getElementById('btnPunchOut').disabled = true;
          } else {
            document.getElementById('btnPunchOut').disabled = false;
          }
        } else {
          document.getElementById('todayStatus').textContent = 'Not Punched';
          document.getElementById('btnPunchIn').disabled = false;
          document.getElementById('btnPunchOut').disabled = true;
        }
      }
      document.getElementById('employeeCard').classList.add('show');
    }

    async function doPunchIn() {
      const btn = document.getElementById('btnPunchIn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Processing...';
      const result = await requestPunchIn(recognizedEmployee.empId, recognizedEmployee.empName, recognizedEmployee.capturedPhoto);
      if (result.success) {
        showSuccess('Punch In Successful!', result.time, 'Have a great day!');
      } else {
        updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> ' + result.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Punch In';
      }
    }

    async function doPunchOut() {
      const btn = document.getElementById('btnPunchOut');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Processing...';
      const result = await requestPunchOut(recognizedEmployee.empId, recognizedEmployee.capturedPhoto);
      if (result.success) {
        showSuccess('Punch Out Successful!', result.time, 'Total hours: ' + result.workHours + ' hrs');
      } else {
        updateStatus('error', '<i class="fas fa-exclamation-triangle"></i> ' + result.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Punch Out';
      }
    }

    function showSuccess(text, time, details) {
      document.getElementById('cameraSection').classList.add('hidden');
      document.getElementById('employeeCard').classList.remove('show');
      document.getElementById('successText').textContent = text;
      document.getElementById('successTime').textContent = time;
      document.getElementById('successDetails').textContent = details;
      document.getElementById('successAnimation').classList.add('show');
    }

    function resetAndScan() {
      recognizedEmployee = null;
      isProcessing = false;
      document.getElementById('successAnimation').classList.remove('show');
      document.getElementById('employeeCard').classList.remove('show');
      document.getElementById('cameraSection').classList.remove('hidden');
      document.getElementById('btnPunchIn').disabled = false;
      document.getElementById('btnPunchIn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Punch In';
      document.getElementById('btnPunchOut').disabled = false;
      document.getElementById('btnPunchOut').innerHTML = '<i class="fas fa-sign-out-alt"></i> Punch Out';
      startFaceDetection();
    }

    function updateStatus(type, message) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = 'status-message ' + type;
      statusEl.innerHTML = message;
    }
  </script>
</body>
</html>
