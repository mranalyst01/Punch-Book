<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punch Book – Face Recognition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3B82F6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 32px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .header {
      background: linear-gradient(135deg, #1e40af, #3B82F6);
      padding: 30px 20px;
      text-align: center;
      color: white;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .datetime {
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 12px;
      margin-top: 16px;
    }
    .date { font-size: 14px; opacity: 0.9; }
    .time { font-size: 32px; font-weight: 700; letter-spacing: 1px; }
    .body { padding: 24px; }
    .video-box {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status {
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .status.loading { background: #FEF3C7; color: #D97706; }
    .status.success { background: #D1FAE5; color: #059669; }
    .status.error { background: #FEE2E2; color: #DC2626; }
    .status.info { background: #DBEAFE; color: #2563EB; }
    .employee-card {
      background: #F9FAFB;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }
    .emp-name { font-size: 24px; font-weight: 700; }
    .emp-dept { color: #6B7280; font-size: 14px; margin: 8px 0; }
    .btn-group { display: flex; gap: 12px; margin: 20px 0 12px; }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-punch-in { background: #10B981; color: white; }
    .btn-punch-out { background: #EF4444; color: white; }
    .btn-secondary { background: #E5E7EB; color: #374151; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none; }
    .success-screen {
      text-align: center;
      padding: 30px 20px;
    }
    .success-icon {
      width: 90px; height: 90px;
      background: #D1FAE5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .success-icon i { font-size: 44px; color: #10B981; }
    .success-text { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .success-time { font-size: 32px; font-weight: 700; color: #10B981; margin: 12px 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>⏰ Punch Book</h1>
    <p>Face Recognition Attendance</p>
    <div class="datetime">
      <div class="date" id="currentDate">--</div>
      <div class="time" id="currentTime">--:--:--</div>
    </div>
  </div>
  <div class="body">
    <!-- Camera Section -->
    <div id="cameraSection">
      <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
      </div>
      <div id="statusMessage" class="status loading">
        <i class="fas fa-spinner fa-spin"></i> Loading AI models...
      </div>
    </div>

    <!-- Employee Info + Punch Buttons -->
    <div id="employeeCard" class="employee-card hidden">
      <div class="emp-name" id="empName">-</div>
      <div class="emp-dept" id="empDept">-</div>
      <div class="btn-group">
        <button class="btn btn-punch-in" id="punchInBtn"><i class="fas fa-sign-in-alt"></i> Punch In</button>
        <button class="btn btn-punch-out" id="punchOutBtn"><i class="fas fa-sign-out-alt"></i> Punch Out</button>
      </div>
      <button class="btn btn-secondary" id="scanAgainBtn"><i class="fas fa-redo"></i> Scan Another Face</button>
    </div>

    <!-- Success Animation -->
    <div id="successScreen" class="success-screen hidden">
      <div class="success-icon"><i class="fas fa-check-circle"></i></div>
      <div class="success-text" id="successMsg">Punched!</div>
      <div class="success-time" id="successTime">--:--:--</div>
      <button class="btn btn-secondary" id="doneBtn"><i class="fas fa-check"></i> Done</button>
    </div>
  </div>
</div>

<script>
  // ----- GLOBALS -----
  let videoStream = null;
  let faceDataList = [];
  let recognizedEmployee = null;
  let isProcessing = false;
  let detectionInterval = null;
  let modelsLoaded = false;

  // DOM elements
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusDiv = document.getElementById('statusMessage');
  const cameraSection = document.getElementById('cameraSection');
  const employeeCard = document.getElementById('employeeCard');
  const successScreen = document.getElementById('successScreen');

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
    document.getElementById('currentTime').innerText = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Status helper
  function setStatus(type, msg) {
    statusDiv.className = `status ${type}`;
    statusDiv.innerHTML = msg;
  }

  // Load face-api models
  async function loadModels() {
    setStatus('loading', '<i class="fas fa-spinner fa-spin"></i> Loading face recognition models...');
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    modelsLoaded = true;
    setStatus('info', '<i class="fas fa-database"></i> Fetching employee face data...');
    
    // Get all registered face descriptors from the sheet
    google.script.run
      .withSuccessHandler(onFaceDataLoaded)
      .withFailureHandler(err => setStatus('error', '<i class="fas fa-exclamation-triangle"></i> ' + err.message))
      .getAllFaceData();
  }

  function onFaceDataLoaded(result) {
    if (!result.success || result.faceData.length === 0) {
      setStatus('error', '<i class="fas fa-user-slash"></i> No registered faces found. Please register employees first.');
      return;
    }
    faceDataList = result.faceData;
    console.log('Loaded', faceDataList.length, 'faces');
    startCamera();
  }

  async function startCamera() {
    try {
      setStatus('loading', '<i class="fas fa-video"></i> Starting camera...');
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
      video.srcObject = videoStream;
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        setStatus('info', '<i class="fas fa-face-smile"></i> Look at camera – face will be detected automatically');
        startFaceDetection();
      };
    } catch(err) {
      setStatus('error', '<i class="fas fa-camera"></i> Camera access denied. Please allow camera.');
    }
  }

  function startFaceDetection() {
    if (detectionInterval) clearInterval(detectionInterval);
    detectionInterval = setInterval(async () => {
      if (isProcessing || !modelsLoaded || faceDataList.length === 0) return;
      try {
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (detection) {
          const box = detection.detection.box;
          ctx.strokeStyle = '#10B981';
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);
          
          // Match with registered faces
          let bestMatch = null, bestDist = 0.6;
          for (let emp of faceDataList) {
            const dist = faceapi.euclideanDistance(detection.descriptor, emp.faceDescriptor);
            if (dist < bestDist) {
              bestDist = dist;
              bestMatch = emp;
            }
          }
          if (bestMatch && !isProcessing) {
            isProcessing = true;
            clearInterval(detectionInterval);
            recognizedEmployee = bestMatch;
            
            // capture photo
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            recognizedEmployee.capturedPhoto = tempCanvas.toDataURL('image/jpeg', 0.7);
            
            setStatus('success', `<i class="fas fa-check-circle"></i> Welcome ${bestMatch.empName}`);
            setTimeout(() => showEmployeeCard(bestMatch), 800);
          } else {
            setStatus('info', '<i class="fas fa-search"></i> Face not recognized – try adjusting light/angle');
          }
        } else {
          setStatus('info', '<i class="fas fa-face-smile"></i> Position your face in the oval area');
        }
      } catch(e) { console.error(e); }
    }, 350);
  }

  async function showEmployeeCard(employee) {
    cameraSection.classList.add('hidden');
    employeeCard.classList.remove('hidden');
    successScreen.classList.add('hidden');
    document.getElementById('empName').innerText = employee.empName;
    
    // get department
    google.script.run.withSuccessHandler(res => {
      if (res.success) document.getElementById('empDept').innerHTML = `${res.employee.department} | ${res.employee.designation}`;
    }).getEmployeeById(employee.empId);
    
    // get today's punch status
    google.script.run.withSuccessHandler(status => {
      const punchInBtn = document.getElementById('punchInBtn');
      const punchOutBtn = document.getElementById('punchOutBtn');
      if (status.success) {
        if (status.hasPunchedIn) {
          punchInBtn.disabled = true;
          if (status.hasPunchedOut) punchOutBtn.disabled = true;
          else punchOutBtn.disabled = false;
        } else {
          punchInBtn.disabled = false;
          punchOutBtn.disabled = true;
        }
      }
    }).getTodayPunchStatus(employee.empId);
  }
  
  // Punch actions
  window.doPunchIn = function() {
    const btn = document.getElementById('punchInBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    google.script.run
      .withSuccessHandler(res => {
        if (res.success) showSuccess('Punch In ✅', res.time, 'Have a great day!');
        else { alert(res.message); resetToCamera(); }
      })
      .withFailureHandler(err => { alert(err.message); resetToCamera(); })
      .punchIn(recognizedEmployee.empId, recognizedEmployee.empName, recognizedEmployee.capturedPhoto);
  };
  
  window.doPunchOut = function() {
    const btn = document.getElementById('punchOutBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    google.script.run
      .withSuccessHandler(res => {
        if (res.success) showSuccess('Punch Out ✅', res.time, `Worked ${res.workHours} hours today`);
        else { alert(res.message); resetToCamera(); }
      })
      .withFailureHandler(err => { alert(err.message); resetToCamera(); })
      .punchOut(recognizedEmployee.empId, recognizedEmployee.capturedPhoto);
  };
  
  function showSuccess(title, time, details) {
    employeeCard.classList.add('hidden');
    successScreen.classList.remove('hidden');
    document.getElementById('successMsg').innerText = title;
    document.getElementById('successTime').innerHTML = `<i class="far fa-clock"></i> ${time}`;
  }
  
  function resetToCamera() {
    recognizedEmployee = null;
    isProcessing = false;
    cameraSection.classList.remove('hidden');
    employeeCard.classList.add('hidden');
    successScreen.classList.add('hidden');
    // re-enable buttons
    document.getElementById('punchInBtn').disabled = false;
    document.getElementById('punchOutBtn').disabled = false;
    document.getElementById('punchInBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Punch In';
    document.getElementById('punchOutBtn').innerHTML = '<i class="fas fa-sign-out-alt"></i> Punch Out';
    startFaceDetection();
  }
  
  // Attach event listeners
  document.getElementById('punchInBtn').onclick = () => doPunchIn();
  document.getElementById('punchOutBtn').onclick = () => doPunchOut();
  document.getElementById('scanAgainBtn').onclick = () => resetToCamera();
  document.getElementById('doneBtn').onclick = () => resetToCamera();
  
  // Start everything
  loadModels();
</script>
</body>
</html>
