<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch Book - Select Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2b589b 0%, #3a82f6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Original Card Styling (Used for both Login and Loader) */
        .card-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* Loader specific styling */
        #loader-overlay {
            display: none; /* Default hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b589b 0%, #3a82f6 100%); /* Matching site background */
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f1f5f9;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #1a1a1a;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .timer-text {
            font-size: 14px;
            color: #666;
            background: #f1f5f9;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
        }

        #countdown-number {
            color: #e11d48; /* Highlight the seconds */
            font-weight: 700;
            font-size: 16px;
        }

        /* Elements inside login card */
        .logo-container { margin-bottom: 15px; }
        .logo { width: 80px; height: auto; border-radius: 8px; }
        .app-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 30px; }
        .button-group { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background-color: #3b82f6; color: #ffffff; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-success { background-color: #10b981; color: #ffffff; }
        .icon { font-size: 16px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="card-container">
            <div class="card">
                <div class="spinner"></div>
                <p id="loading-message" class="loading-text">Connecting...</p>
                <div class="timer-text">
                    Redirecting in <span id="countdown-number">10</span> seconds
                </div>
            </div>
        </div>
    </div>

    <div class="card-container">
        <div class="card">
            <div class="logo-container"> 
                <img src="punchbook_logo.png" alt="Punch Book Logo" class="logo">
            </div>
            
            <h1 class="app-title">Punch Book</h1>
            <p class="subtitle">Select a portal to continue</p>

            <div class="button-group">
                <button class="btn btn-primary" onclick="handleNavigation('Admin')">
                    <i class="icon">⚙️</i> Admin Portal
                </button>
                <button class="btn btn-secondary" onclick="handleNavigation('Employee')">
                    <i class="icon">👤</i> Employee Portal
                </button>
                <button class="btn btn-success" onclick="handleNavigation('Employee Punch')">
                    <i class="icon">⏱️</i> Employee Punch
                </button>
            </div>
        </div>
    </div>

    <script>
        function handleNavigation(portalType) {
            // Text update
            document.getElementById('loading-message').innerText = `Connecting to ${portalType} Portal`;
            
            // Show Loader Overlay
            document.getElementById('loader-overlay').style.display = 'flex';
            
            let timeLeft = 10;
            let countdownElement = document.getElementById('countdown-number');
            countdownElement.innerText = timeLeft;

            // Timer logic - har second number update hoga
            let timer = setInterval(function() {
                timeLeft--;
                countdownElement.innerText = timeLeft;

                // Jab timer 0 ho jaye
                if (timeLeft <= 0) {
                    clearInterval(timer); // Timer roko
                    
                    // Sahi link par redirect karo
                    if (portalType === 'Admin') {
                        window.location.href = 'https://mranalyst01.github.io/Punch-Book/admin/';
                    } else if (portalType === 'Employee') {
                        window.location.href = 'https://mranalyst01.github.io/Punch-Book/employee-portal/'; 
                    } else if (portalType === 'Employee Punch') {
                        window.location.href = 'https://mranalyst01.github.io/Punch-Book/employee-punch/'; 
                    }
                }
            }, 1000); // 1000 ms = 1 second
        }
    </script>

</body>
</html>
