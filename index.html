<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch Book - Select Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
 
        body {
            background: linear-gradient(135deg, #2b589b 0%, #3a82f6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo {
            width: 80px; 
            height: auto;
            border-radius: 8px; 
        }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #3b82f6; 
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .btn-success {
            background-color: #10b981; 
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .icon {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-container"> 
                <img src="punchbook_logo.png" alt="Punch Book Logo" class="logo">
            </div>
            
            <h1 class="app-title">Punch Book</h1>
            <p class="subtitle">Select a portal to continue</p>

            <div class="button-group">
                <button class="btn btn-primary" onclick="handleNavigation('Admin')">
                    <i class="icon">⚙️</i> Admin Portal
                </button>
                <button class="btn btn-secondary" onclick="handleNavigation('Employee')">
                    <i class="icon">👤</i> Employee Portal
                </button>
                <button class="btn btn-success" onclick="handleNavigation('Punch')">
                    <i class="icon">⏱️</i> Employee Punch
                </button>
            </div>
        </div>
    </div>

    <script>
        // JavaScript function to handle button clicks
        function handleNavigation(portalType) {
            // Placeholder logic: Alert the user
            alert(`Redirecting to the ${portalType} system...`);
            
            // Future implementation: Redirect to the actual URLs
            // if (portalType === 'Admin') window.location.href = '/admin-login';
            // if (portalType === 'Employee') window.location.href = '/employee-login';
            // if (portalType === 'Punch') window.location.href = '/time-clock';
        }
    </script>

</body>
</html>
